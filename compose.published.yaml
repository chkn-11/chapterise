# Standalone deployment file; no source checkout or local build required.
services:
  chapterise:
    image: ghcr.io/chkn-11/chapterise:latest
    init: true
    restart: unless-stopped
    ports:
      - "${CHAPTERISE_BIND:-127.0.0.1}:${CHAPTERISE_PORT:-8765}:8765"
    environment:
      CHAPTERISE_PUBLIC_ORIGIN: "${CHAPTERISE_PUBLIC_ORIGIN:-http://127.0.0.1:8765}"
    volumes:
      - projects:/data
      - models:/models

volumes:
  projects:
  models:
