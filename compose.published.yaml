# Standalone deployment file; no source checkout or local build required.
services:
  chapterise:
    image: ghcr.io/chkn-11/chapterise:v1
    init: true
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - projects:/data
      - models:/models

volumes:
  projects:
  models:
